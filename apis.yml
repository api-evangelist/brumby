aid: brumby
name: Brumby
description: 'Brumby (formerly GrazeMate) is a Y Combinator-backed (W2026) precision-grazing
  company based in Sydney, Australia, building an autonomous drone toolkit for cattle
  ranchers. Brumby drones plan routes and move herds with gentle, AI-guided pressure,
  fly scheduled monitoring missions that locate and count every animal, measure standing
  dry-matter pasture biomass from the air, and inspect water troughs, tanks and fences
  on every flight — all managed from a single phone app that works online or in a local
  base-station mode without connectivity. The company is running pilot programs and does
  not yet publish a public API, developer portal, or documentation; this profile is a
  company lead maintained in the API Evangelist network.'
